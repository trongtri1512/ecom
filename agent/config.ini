[server]
; Địa chỉ web service (IP + port hoặc domain). KHÔNG có dấu / ở cuối.
url = http://103.73.67.64:8000
; API key phải KHỚP với biến API_KEY trong .env trên VPS.
api_key = 6FxcfI0a8Ce6AXRy2bSopJdeM-4sPSZ1HMAqelJgANM

[agent]
; Tên máy quét này (hiện ở cột "Nguồn" trên web + trên tiêu đề cửa sổ).
; Đổi thành tên phân biệt máy: quay-1, quay-2, ban-A...
name = quay-dong-goi-1
; true = mở cửa sổ giao diện lúc khởi động; false = chạy thẳng xuống khay.
show_window = true

[scanner]
; Ngưỡng phân biệt máy quét (gõ nhanh) vs gõ tay (giây).
inter_key_timeout = 0.05
; Độ dài tối thiểu 1 mã hợp lệ.
min_length = 6
; Bíp khi quét OK / cảnh báo khi trùng.
beep = true
